<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nerede Yesem">
<title>Nerede Yesem? 🍽️</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
  --border: rgba(255,255,255,.08); --text: #f0f2ff; --text2: #8b90b0; --text3: #4a4f6a;
  --accent: #ff6b35; --accent2: #ffd166; --green: #06d6a0; --blue: #4cc9f0;
  --safe-top: env(safe-area-inset-top,0px); --safe-bottom: env(safe-area-inset-bottom,0px);
}
html,body { height:100%; font-family:'Plus Jakarta Sans',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }
#app { max-width:430px; height:100dvh; margin:0 auto; display:flex; flex-direction:column; position:relative; overflow:hidden; }
.header { padding:calc(var(--safe-top) + 12px) 14px 8px; position:relative; z-index:100; background:linear-gradient(to bottom,var(--bg) 80%,transparent); }
.header-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.app-logo { font-size:20px; font-weight:800; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; flex-shrink:0; }
.location-pill { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:7px 10px; display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--text2); overflow:hidden; }
.loc-dot { width:7px; height:7px; border-radius:50%; background:var(--text3); flex-shrink:0; animation:pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.4)} }
.loc-text { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.radius-btn { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:7px 10px; font-size:12px; font-weight:700; color:var(--text2); cursor:pointer; white-space:nowrap; font-family:'Plus Jakarta Sans',sans-serif; }
.filter-row { display:flex; gap:5px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
.filter-row::-webkit-scrollbar { display:none; }
.chip { flex-shrink:0; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:700; cursor:pointer; transition:all .2s; border:1.5px solid var(--border); background:var(--surface); color:var(--text2); white-space:nowrap; }
.chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }
#map { flex:1; position:relative; z-index:1; }
.bottom-sheet { position:absolute; bottom:0; left:0; right:0; z-index:200; transition:transform .35s cubic-bezier(.32,.72,0,1); }
.bottom-sheet.collapsed { transform:translateY(calc(100% - 175px)); }
.bottom-sheet.expanded { transform:translateY(0); }
.sheet-handle-area { padding:6px 0 0; display:flex; justify-content:center; cursor:pointer; }
.sheet-handle { width:36px; height:4px; border-radius:2px; background:rgba(255,255,255,.2); }
.sheet-body { background:var(--surface); border-radius:24px 24px 0 0; border-top:1px solid var(--border); max-height:72dvh; display:flex; flex-direction:column; overflow:hidden; }
.sheet-top { padding:10px 14px 6px; flex-shrink:0; }
.sheet-meta { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.sheet-count { font-size:13px; font-weight:700; color:var(--text2); }
.sheet-count span { color:var(--accent); }
.sort-row { display:flex; gap:5px; overflow-x:auto; scrollbar-width:none; }
.sort-row::-webkit-scrollbar { display:none; }
.sort-chip { flex-shrink:0; padding:5px 11px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer; background:var(--surface2); color:var(--text2); border:1px solid var(--border); white-space:nowrap; }
.sort-chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.place-list { overflow-y:auto; scrollbar-width:none; padding:4px 14px calc(var(--safe-bottom) + 14px); flex:1; }
.place-list::-webkit-scrollbar { display:none; }
.place-card { background:var(--surface2); border-radius:16px; padding:12px; margin-bottom:7px; display:flex; gap:10px; cursor:pointer; transition:all .2s; border:1.5px solid transparent; animation:slideUp .3s ease forwards; opacity:0; }
@keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
.place-card:active { transform:scale(.98); }
.place-card.selected { border-color:var(--accent); background:rgba(255,107,53,.08); }
.place-icon { width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
.place-info { flex:1; min-width:0; }
.place-name { font-size:14px; font-weight:800; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.place-type { font-size:11px; font-weight:600; color:var(--text2); margin-bottom:4px; }
.place-meta { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
.mp { display:flex; align-items:center; gap:3px; font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; }
.mp-dist { background:rgba(76,201,240,.12); color:var(--blue); }
.mp-stars { background:rgba(255,209,102,.12); color:var(--accent2); }
.mp-open { background:rgba(6,214,160,.12); color:var(--green); }
.mp-closed { background:rgba(255,107,53,.12); color:var(--accent); }
.mp-tag { background:rgba(255,255,255,.06); color:var(--text2); }
.place-actions { display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex-shrink:0; }
.route-btn { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:6px 10px; font-size:11px; font-weight:800; font-family:'Plus Jakarta Sans',sans-serif; cursor:pointer; white-space:nowrap; }
.fav-btn { background:transparent; border:none; font-size:17px; cursor:pointer; }
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:300; display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .25s; backdrop-filter:blur(8px); max-width:430px; margin:0 auto; }
.overlay.open { opacity:1; pointer-events:all; }
.modal { background:var(--surface); border-radius:24px 24px 0 0; width:100%; padding:8px 18px calc(var(--safe-bottom) + 22px); transform:translateY(100%); transition:transform .3s cubic-bezier(.32,.72,0,1); max-height:88dvh; overflow-y:auto; }
.overlay.open .modal { transform:translateY(0); }
.modal-handle { width:36px; height:4px; background:var(--border); border-radius:2px; margin:8px auto 16px; }
.d-header { display:flex; gap:12px; margin-bottom:14px; align-items:flex-start; }
.d-icon { width:52px; height:52px; border-radius:15px; display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0; }
.d-title { font-size:19px; font-weight:800; margin-bottom:3px; }
.d-sub { font-size:12px; color:var(--text2); font-weight:600; }
.d-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:14px; }
.d-stat { background:var(--surface2); border-radius:13px; padding:11px 13px; }
.d-stat-lbl { font-size:10px; color:var(--text3); font-weight:700; text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px; }
.d-stat-val { font-size:15px; font-weight:800; }
.big-btn { width:100%; border:none; border-radius:13px; padding:14px; font-size:14px; font-weight:800; font-family:'Plus Jakarta Sans',sans-serif; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px; margin-bottom:7px; }
.big-btn.primary { background:var(--accent); color:#fff; }
.big-btn.secondary { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
.stars { color:var(--accent2); font-size:13px; margin-top:3px; }
.loading-overlay { position:absolute; inset:0; z-index:150; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:rgba(15,17,23,.85); backdrop-filter:blur(8px); pointer-events:none; opacity:0; transition:opacity .3s; }
.loading-overlay.show { opacity:1; pointer-events:all; }
.loader { width:40px; height:40px; border:3px solid rgba(255,107,53,.2); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
.loading-text { font-size:13px; font-weight:700; color:var(--text2); }
.empty-state { text-align:center; padding:28px 16px; }
.empty-state .emoji { font-size:44px; margin-bottom:10px; }
.empty-state p { color:var(--text2); font-size:13px; line-height:1.6; font-weight:500; }
.radius-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:400; display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .2s; max-width:430px; margin:0 auto; backdrop-filter:blur(4px); }
.radius-overlay.open { opacity:1; pointer-events:all; }
.radius-modal { background:var(--surface); border-radius:24px 24px 0 0; width:100%; padding:8px 18px calc(var(--safe-bottom) + 22px); transform:translateY(100%); transition:transform .3s cubic-bezier(.32,.72,0,1); }
.radius-overlay.open .radius-modal { transform:translateY(0); }
.radius-title { font-size:17px; font-weight:800; margin:10px 0 14px; }
.radius-opts { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.radius-opt { background:var(--surface2); border:2px solid var(--border); border-radius:13px; padding:14px; text-align:center; cursor:pointer; font-size:15px; font-weight:800; font-family:'Plus Jakarta Sans',sans-serif; color:var(--text); }
.radius-opt.active { background:rgba(255,107,53,.15); border-color:var(--accent); color:var(--accent); }
.radius-opt small { display:block; font-size:11px; color:var(--text3); font-weight:600; margin-top:2px; }
.route-info { background:rgba(255,107,53,.12); border:1.5px solid var(--accent); border-radius:14px; padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; gap:10px; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-row">
      <div class="app-logo">🍽 Nerede?</div>
      <div class="location-pill">
        <div class="loc-dot" id="locDot"></div>
        <span class="loc-text" id="locText">Konum alınıyor...</span>
      </div>
      <button class="radius-btn" onclick="openRadiusModal()" id="radiusBtn">📍 500m</button>
    </div>
    <div class="filter-row" id="typeFilters">
      <div class="chip active" data-type="all" onclick="toggleType('all')">🍽 Tümü</div>
      <div class="chip" data-type="cafe" onclick="toggleType('cafe')">☕ Cafe</div>
      <div class="chip" data-type="restaurant" onclick="toggleType('restaurant')">🍜 Restaurant</div>
      <div class="chip" data-type="bakery" onclick="toggleType('bakery')">🥐 Pastane</div>
      <div class="chip" data-type="fast_food" onclick="toggleType('fast_food')">🍔 Fast Food</div>
    </div>
  </div>

  <div id="map"></div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loader"></div>
    <div class="loading-text">Mekanlar aranıyor...</div>
  </div>

  <div class="bottom-sheet collapsed" id="bottomSheet">
    <div class="sheet-handle-area" onclick="toggleSheet()"><div class="sheet-handle"></div></div>
    <div class="sheet-body">
      <div class="sheet-top">
        <div class="sheet-meta"><div class="sheet-count"><span id="placeCount">0</span> mekan bulundu</div></div>
        <div class="sort-row">
          <div class="sort-chip active" data-sort="distance" onclick="setSort('distance')">📍 Mesafe</div>
          <div class="sort-chip" data-sort="rating" onclick="setSort('rating')">⭐ Puan</div>
          <div class="sort-chip" data-sort="name" onclick="setSort('name')">🔤 İsim</div>
          <div class="sort-chip" data-sort="reviews" onclick="setSort('reviews')">💬 Yorum</div>
        </div>
      </div>
      <div class="place-list" id="placeList"></div>
    </div>
  </div>

  <div class="overlay" id="detailOverlay" onclick="closeDetailOnBg(event)">
    <div class="modal"><div class="modal-handle"></div><div id="detailContent"></div></div>
  </div>

  <div class="radius-overlay" id="radiusOverlay" onclick="closeRadiusBg(event)">
    <div class="radius-modal">
      <div class="modal-handle"></div>
      <div class="radius-title">Arama Mesafesi</div>
      <div class="radius-opts">
        <div class="radius-opt" data-r="300" onclick="setRadius(300)">300m<small>Yürüme</small></div>
        <div class="radius-opt active" data-r="500" onclick="setRadius(500)">500m<small>Yakın çevre</small></div>
        <div class="radius-opt" data-r="1000" onclick="setRadius(1000)">1 km<small>Geniş alan</small></div>
        <div class="radius-opt" data-r="2000" onclick="setRadius(2000)">2 km<small>Mahalle</small></div>
      </div>
    </div>
  </div>
</div>

<script>
const API_KEY = 'AIzaSyC8bb0ULcpoemQElpcSDgGhz-9s1RZFyqs';
let map, service, userLat, userLon, userMarker, directionsRenderer;
let places=[], markers=[];
let activeType='all', sortBy='distance', radius=500;
let favorites=JSON.parse(localStorage.getItem('nerede_favs')||'[]');
let selectedId=null, sheetExpanded=false;

const TC = {
  cafe:       {label:'Cafe / Kahvaltı', emoji:'☕', color:'#ff9f43', bg:'rgba(255,159,67,.18)'},
  restaurant: {label:'Restaurant',      emoji:'🍜', color:'#ff6b35', bg:'rgba(255,107,53,.18)'},
  bakery:     {label:'Pastane / Fırın', emoji:'🥐', color:'#ffd166', bg:'rgba(255,209,102,.18)'},
  fast_food:  {label:'Fast Food',       emoji:'🍔', color:'#06d6a0', bg:'rgba(6,214,160,.18)'},
};
function tc(types) {
  if (!types) return TC.restaurant;
  for (const t of ['cafe','bakery','fast_food','restaurant']) if (types.includes(t)) return TC[t];
  return {label:'Yeme İçme', emoji:'🍽', color:'#8b90b0', bg:'rgba(139,144,176,.15)'};
}

function initMap() {
  const dark = [
    {elementType:'geometry',stylers:[{color:'#1a1d27'}]},
    {elementType:'labels.text.fill',stylers:[{color:'#8b90b0'}]},
    {elementType:'labels.text.stroke',stylers:[{color:'#1a1d27'}]},
    {featureType:'road',elementType:'geometry',stylers:[{color:'#2d3148'}]},
    {featureType:'road.highway',elementType:'geometry',stylers:[{color:'#3d4270'}]},
    {featureType:'water',elementType:'geometry',stylers:[{color:'#0f1117'}]},
    {featureType:'poi',elementType:'geometry',stylers:[{color:'#22263a'}]},
    {featureType:'poi.park',elementType:'geometry',stylers:[{color:'#1e2a1e'}]},
    {featureType:'transit',elementType:'geometry',stylers:[{color:'#22263a'}]},
  ];
  map = new google.maps.Map(document.getElementById('map'), {
    zoom:16, center:{lat:41.015,lng:28.98}, styles:dark,
    disableDefaultUI:true, zoomControl:true,
    zoomControlOptions:{position:google.maps.ControlPosition.RIGHT_CENTER},
    gestureHandling:'greedy', clickableIcons:false,
  });
  service = new google.maps.places.PlacesService(map);
  map.addListener('click', ()=>{closeDetail();deselectAll();});
  getLocation();
}

function getLocation() {
  document.getElementById('locDot').style.background='var(--accent2)';
  if (!navigator.geolocation) { useFallback(); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      userLat=pos.coords.latitude; userLon=pos.coords.longitude;
      document.getElementById('locDot').style.background='var(--green)';
      map.setCenter({lat:userLat,lng:userLon});
      placeUserMarker(); reverseGeocode(); fetchPlaces();
    },
    ()=>useFallback(), {enableHighAccuracy:true,timeout:8000}
  );
}
function useFallback() {
  userLat=41.0369; userLon=28.9850;
  document.getElementById('locDot').style.background='var(--accent)';
  document.getElementById('locText').textContent='Demo: Taksim';
  map.setCenter({lat:userLat,lng:userLon});
  placeUserMarker(); fetchPlaces();
}
function placeUserMarker() {
  if (userMarker) userMarker.setMap(null);
  userMarker = new google.maps.Marker({
    position:{lat:userLat,lng:userLon}, map,
    icon:{path:google.maps.SymbolPath.CIRCLE,scale:9,fillColor:'#4cc9f0',fillOpacity:1,strokeColor:'#fff',strokeWeight:2.5},
    title:'Konumunuz', zIndex:999
  });
}
async function reverseGeocode() {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${userLat}&lon=${userLon}&format=json&accept-language=tr`);
    const d = await r.json();
    const name = d.address?.suburb||d.address?.neighbourhood||d.address?.city_district||d.address?.city||'Konumunuz';
    document.getElementById('locText').textContent=name;
  } catch(e) { document.getElementById('locText').textContent='Konumunuz'; }
}

function fetchPlaces() {
  showLoading();
  markers.forEach(m=>m.setMap(null)); markers=[]; places=[];
  const typeMap = {
    all:['cafe','restaurant','bakery','fast_food'],
    cafe:['cafe'], restaurant:['restaurant'], bakery:['bakery'], fast_food:['fast_food']
  };
  const types = typeMap[activeType];
  let done=0;
  types.forEach(type => {
    service.nearbySearch({
      location:{lat:userLat,lng:userLon}, radius, type
    }, (results,status) => {
      if (status===google.maps.places.PlacesServiceStatus.OK && results) {
        results.forEach(p => {
          if (p.business_status !== 'CLOSED_PERMANENTLY' && !places.find(x=>x.place_id===p.place_id))
            places.push(proc(p));
        });
      }
      if (++done===types.length) { hideLoading(); renderAll(); if(places.length>0) expandSheet(); document.getElementById('placeCount').textContent=places.length; }
    });
  });
}
function proc(p) {
  const dist=calcDist(userLat,userLon,p.geometry.location.lat(),p.geometry.location.lng());
  return {
    place_id:p.place_id, name:p.name,
    lat:p.geometry.location.lat(), lng:p.geometry.location.lng(),
    types:p.types||[], rating:p.rating||null, user_ratings_total:p.user_ratings_total||0,
    price_level:p.price_level, vicinity:p.vicinity||'',
    opening_hours:p.opening_hours||null, business_status:p.business_status, distance:dist
  };
}

function calcDist(a,b,c,d) {
  const R=6371000, dLat=(c-a)*Math.PI/180, dLon=(d-b)*Math.PI/180;
  return Math.round(R*2*Math.atan2(Math.sqrt(Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2),Math.sqrt(1-(Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2))));
}
function fmtDist(m) { return m<1000?m+'m':(m/1000).toFixed(1)+'km'; }
function starStr(r) { const f=Math.floor(r),h=(r%1)>=.5?1:0; return '★'.repeat(f)+(h?'½':'')+'☆'.repeat(5-f-h); }
function price(p) { return ['','₺','₺₺','₺₺₺','₺₺₺₺'][p]||''; }

function getSorted() {
  return [...places].sort((a,b)=>{
    if(sortBy==='distance') return a.distance-b.distance;
    if(sortBy==='rating') return (b.rating||0)-(a.rating||0);
    if(sortBy==='name') return a.name.localeCompare(b.name,'tr');
    if(sortBy==='reviews') return b.user_ratings_total-a.user_ratings_total;
    return 0;
  });
}

function renderAll() { renderMarkers(); renderList(); }

function renderMarkers() {
  markers.forEach(m=>m.setMap(null)); markers=[];
  getSorted().forEach(p => {
    const t=tc(p.types), sel=p.place_id===selectedId;
    const svg=`<svg width="38" height="44" viewBox="0 0 38 44" xmlns="http://www.w3.org/2000/svg"><path d="M19 0C8.5 0 0 8.5 0 19c0 14.25 19 25 19 25s19-10.75 19-25C38 8.5 29.5 0 19 0z" fill="${sel?'#fff':t.color}" stroke="${sel?t.color:'rgba(0,0,0,.3)'}" stroke-width="${sel?3:1}"/><text x="19" y="25" text-anchor="middle" font-size="18">${t.emoji}</text></svg>`;
    const m=new google.maps.Marker({
      position:{lat:p.lat,lng:p.lng}, map, title:p.name, zIndex:sel?100:1,
      icon:{url:`data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`,scaledSize:new google.maps.Size(38,44),anchor:new google.maps.Point(19,44)}
    });
    m.addListener('click',()=>openDetail(p.place_id));
    markers.push(m);
  });
}

function renderList() {
  const sorted=getSorted();
  const list=document.getElementById('placeList');
  if (sorted.length===0) { list.innerHTML=`<div class="empty-state"><div class="emoji">🔍</div><p>Bu alanda açık mekan bulunamadı.<br>Mesafeyi artırmayı deneyin.</p></div>`; return; }
  list.innerHTML=sorted.map((p,i)=>{
    const t=tc(p.types), fav=favorites.includes(p.place_id);
    const isOpen=p.opening_hours?.isOpen?.()??null;
    return `<div class="place-card ${p.place_id===selectedId?'selected':''}" onclick="openDetail('${p.place_id}')" style="animation-delay:${i*0.03}s">
      <div class="place-icon" style="background:${t.bg}">${t.emoji}</div>
      <div class="place-info">
        <div class="place-name">${p.name}</div>
        <div class="place-type">${t.label}${price(p.price_level)?' · '+price(p.price_level):''}</div>
        <div class="place-meta">
          <span class="mp mp-dist">📍 ${fmtDist(p.distance)}</span>
          ${p.rating?`<span class="mp mp-stars">⭐ ${p.rating} (${p.user_ratings_total})</span>`:''}
          ${p.business_status==='CLOSED_TEMPORARILY'?`<span class="mp mp-closed">⚠️ Geçici Kapalı</span>`:
            isOpen===true?`<span class="mp mp-open">✅ Açık</span>`:
            isOpen===false?`<span class="mp mp-closed">🔴 Kapalı</span>`:''}
        </div>
      </div>
      <div class="place-actions">
        <button class="route-btn" onclick="event.stopPropagation();goRoute(${p.lat},${p.lng},'${p.name.replace(/'/g,"\\'")}')">🧭 Yol Tarifi</button>
        <button class="fav-btn" onclick="event.stopPropagation();toggleFav('${p.place_id}')">${fav?'❤️':'🤍'}</button>
      </div>
    </div>`;
  }).join('');
}

function openDetail(pid) {
  const p=places.find(x=>x.place_id===pid); if(!p) return;
  selectedId=pid; renderAll(); map.panTo({lat:p.lat,lng:p.lng});
  const t=tc(p.types), fav=favorites.includes(pid), isOpen=p.opening_hours?.isOpen?.()??null;
  document.getElementById('detailContent').innerHTML=`<div style="text-align:center;padding:20px 0;color:var(--text2);font-size:13px">Detaylar yükleniyor...</div>`;
  document.getElementById('detailOverlay').classList.add('open');
  service.getDetails({placeId:pid,fields:['name','formatted_phone_number','website','opening_hours','url','formatted_address']},(det,st)=>{
    const phone=det?.formatted_phone_number||null, website=det?.website||null;
    const mapsUrl=det?.url||`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
    const addr=det?.formatted_address||p.vicinity;
    const oh=det?.opening_hours||p.opening_hours;
    const nowOpen=oh?.isOpen?.()??null;
    document.getElementById('detailContent').innerHTML=`
      <div class="d-header">
        <div class="d-icon" style="background:${t.bg}">${t.emoji}</div>
        <div style="flex:1;min-width:0">
          <div class="d-title">${p.name}</div>
          <div class="d-sub" style="margin-bottom:2px">${addr}</div>
          ${p.rating?`<div class="stars">${starStr(p.rating)} <span style="font-size:11px;color:var(--text2);font-weight:700">${p.rating} · ${p.user_ratings_total} yorum</span></div>`:''}
        </div>
      </div>
      <div class="d-grid">
        <div class="d-stat"><div class="d-stat-lbl">📍 Mesafe</div><div class="d-stat-val">${fmtDist(p.distance)}</div></div>
        <div class="d-stat"><div class="d-stat-lbl">💰 Fiyat</div><div class="d-stat-val">${price(p.price_level)||'—'}</div></div>
        <div class="d-stat" style="grid-column:1/-1">
          <div class="d-stat-lbl">🕐 Durum</div>
          <div class="d-stat-val" style="font-size:14px;color:${p.business_status==='CLOSED_TEMPORARILY'?'var(--accent2)':nowOpen===true?'var(--green)':nowOpen===false?'var(--accent)':'var(--text2)'}">
            ${p.business_status==='CLOSED_TEMPORARILY'?'⚠️ Geçici Olarak Kapalı':nowOpen===true?'✅ Şu an açık':nowOpen===false?'🔴 Şu an kapalı':'ℹ️ Saat bilgisi yok'}
          </div>
        </div>
        ${phone?`<div class="d-stat" style="grid-column:1/-1"><div class="d-stat-lbl">📞 Telefon</div><div class="d-stat-val" style="font-size:14px"><a href="tel:${phone}" style="color:var(--blue);text-decoration:none">${phone}</a></div></div>`:''}
        ${oh?.weekday_text?.length?`<div class="d-stat" style="grid-column:1/-1"><div class="d-stat-lbl">🗓 Haftalık Saatler</div><div style="font-size:11px;color:var(--text2);font-weight:600;line-height:1.7;margin-top:4px">${oh.weekday_text.join('<br>')}</div></div>`:''}
      </div>
      <button class="big-btn primary" onclick="goRoute(${p.lat},${p.lng},'${p.name.replace(/'/g,"\\'")}')">🧭 Yol Tarifi Al</button>
      <button class="big-btn secondary" onclick="window.open('${mapsUrl}','_blank')">🗺 Google Maps'te Aç</button>
      ${website?`<button class="big-btn secondary" onclick="window.open('${website}','_blank')">🌐 Web Sitesi</button>`:''}
      <div style="display:flex;justify-content:center;margin-top:10px">
        <button id="favBtn_${pid}" onclick="toggleFav('${pid}')" style="background:transparent;border:none;font-size:13px;font-weight:700;color:var(--text2);cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;gap:5px">
          ${fav?'❤️ Favorilerden Çıkar':'🤍 Favorilere Ekle'}
        </button>
      </div>
    `;
  });
}

function closeDetail() { document.getElementById('detailOverlay').classList.remove('open'); }
function closeDetailOnBg(e) { if(e.target===document.getElementById('detailOverlay')) closeDetail(); }
function deselectAll() { selectedId=null; renderAll(); }

function goRoute(lat,lng,name) {
  closeDetail();
  if (directionsRenderer) directionsRenderer.setMap(null);
  directionsRenderer=new google.maps.DirectionsRenderer({
    map, suppressMarkers:false,
    polylineOptions:{strokeColor:'#ff6b35',strokeWeight:5,strokeOpacity:.85}
  });
  new google.maps.DirectionsService().route({
    origin:{lat:userLat,lng:userLon}, destination:{lat,lng},
    travelMode:google.maps.TravelMode.WALKING
  },(result,status)=>{
    if (status==='OK') {
      directionsRenderer.setDirections(result);
      const leg=result.routes[0].legs[0];
      const old=document.getElementById('routeInfo');
      if(old) old.remove();
      document.getElementById('placeList').insertAdjacentHTML('afterbegin',
        `<div class="route-info" id="routeInfo">
          <div style="font-size:22px">🚶</div>
          <div style="flex:1"><div style="font-size:13px;font-weight:800">${name}</div>
          <div style="font-size:12px;color:var(--text2);margin-top:2px">${leg.distance.text} · ${leg.duration.text}</div></div>
          <button onclick="clearRoute()" style="background:transparent;border:none;font-size:18px;cursor:pointer;color:var(--text2)">✕</button>
        </div>`);
      expandSheet();
    } else {
      window.open(`https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLon}&destination=${lat},${lng}&travelmode=walking`,'_blank');
    }
  });
}
function clearRoute() { if(directionsRenderer){directionsRenderer.setMap(null);directionsRenderer=null;} renderList(); }

function toggleType(type) {
  activeType=type;
  document.querySelectorAll('#typeFilters .chip').forEach(c=>c.classList.toggle('active',c.dataset.type===type));
  if(directionsRenderer){directionsRenderer.setMap(null);directionsRenderer=null;}
  fetchPlaces();
}
function setSort(s) {
  sortBy=s;
  document.querySelectorAll('.sort-chip').forEach(c=>c.classList.toggle('active',c.dataset.sort===s));
  renderAll();
}
function toggleFav(pid) {
  favorites=favorites.includes(pid)?favorites.filter(f=>f!==pid):[...favorites,pid];
  localStorage.setItem('nerede_favs',JSON.stringify(favorites));
  renderList();
  const btn=document.getElementById('favBtn_'+pid);
  if(btn) btn.innerHTML=favorites.includes(pid)?'❤️ Favorilerden Çıkar':'🤍 Favorilere Ekle';
}
function openRadiusModal() { document.getElementById('radiusOverlay').classList.add('open'); }
function closeRadiusBg(e) { if(e.target===document.getElementById('radiusOverlay')) document.getElementById('radiusOverlay').classList.remove('open'); }
function setRadius(r) {
  radius=r;
  document.querySelectorAll('.radius-opt').forEach(o=>o.classList.toggle('active',parseInt(o.dataset.r)===r));
  document.getElementById('radiusBtn').textContent=`📍 ${r>=1000?r/1000+'km':r+'m'}`;
  document.getElementById('radiusOverlay').classList.remove('open');
  fetchPlaces();
}
function toggleSheet() { sheetExpanded=!sheetExpanded; document.getElementById('bottomSheet').className=`bottom-sheet ${sheetExpanded?'expanded':'collapsed'}`; }
function expandSheet() { sheetExpanded=true; document.getElementById('bottomSheet').className='bottom-sheet expanded'; }
function showLoading() { document.getElementById('loadingOverlay').classList.add('show'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.remove('show'); }
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC8bb0ULcpoemQElpcSDgGhz-9s1RZFyqs&libraries=places&callback=initMap" async defer></script>
</body>
</html>
